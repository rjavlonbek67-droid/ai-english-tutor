<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AI Ingliz tili ustozi</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='14' y='6' width='36' height='52' rx='18' fill='%23fff' stroke='%238ec5ff' stroke-width='4'/%3E%3Ccircle cx='26' cy='28' r='4' fill='%232f6fe6'/%3E%3Ccircle cx='38' cy='28' r='4' fill='%232f6fe6'/%3E%3Cpath d='M24 40c3 4 13 4 16 0' fill='none' stroke='%231b2836' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="eyebrow">Shaxsiy ustoz</p>
            <h1>AI Ingliz tili ustozi</h1>
          </div>
        </div>
      </header>

      <main class="layout">
        <section class="stage" aria-label="Ustoz qiyofasi">
          <div class="stage-glow" aria-hidden="true"></div>

          <div id="avatar" class="avatar" data-state="idle" data-sticker="calm" data-gesture="rest">
            <div class="robot" aria-hidden="true">
              <div class="robot-arm arm-left">
                <div class="limb upper"></div>
                <div class="limb fore"><div class="hand"></div></div>
              </div>
              <div class="robot-arm arm-right">
                <div class="limb upper"></div>
                <div class="limb fore"><div class="hand"></div></div>
              </div>
              <div class="robot-body">
                <div class="robot-head">
                  <span class="antenna"></span>
                  <div class="visor">
                    <img class="visor-emoji" alt="" />
                    <svg class="visor-draw" viewBox="0 0 160 72">
                      <g class="face face-calm">
                        <path d="M36 30h24M100 30h24" fill="none" stroke="#8ef6ff" stroke-width="6" stroke-linecap="round"/>
                        <path d="M58 50c14 10 30 10 44 0" fill="none" stroke="#8ef6ff" stroke-width="5" stroke-linecap="round"/>
                      </g>
                      <g class="face face-joy">
                        <path d="M34 36c8-14 20-14 28 0M98 36c8-14 20-14 28 0" fill="none" stroke="#8ef6ff" stroke-width="6" stroke-linecap="round"/>
                        <path d="M52 44c16 22 40 22 56 0" fill="#14343a" stroke="#8ef6ff" stroke-width="4"/>
                      </g>
                      <g class="face face-think">
                        <path d="M34 24c10 8 22 8 28 0M104 28h24" fill="none" stroke="#8ef6ff" stroke-width="5" stroke-linecap="round"/>
                        <circle cx="48" cy="38" r="6" fill="#8ef6ff"/>
                        <circle cx="112" cy="38" r="6" fill="#8ef6ff"/>
                        <path d="M70 54h28" fill="none" stroke="#8ef6ff" stroke-width="5" stroke-linecap="round"/>
                      </g>
                      <g class="face face-shock">
                        <circle cx="48" cy="30" r="10" fill="none" stroke="#fff4b0" stroke-width="4"/>
                        <circle cx="112" cy="30" r="10" fill="none" stroke="#fff4b0" stroke-width="4"/>
                        <circle cx="48" cy="30" r="4" fill="#fff4b0"/>
                        <circle cx="112" cy="30" r="4" fill="#fff4b0"/>
                        <ellipse cx="80" cy="54" rx="12" ry="10" fill="#fff4b0"/>
                      </g>
                      <g class="face face-sad">
                        <path d="M34 24c10 10 22 8 28-2M98 22c8 10 22 10 30-2" fill="none" stroke="#9ec6ff" stroke-width="5" stroke-linecap="round"/>
                        <path d="M40 34h18M102 34h18" fill="none" stroke="#9ec6ff" stroke-width="6" stroke-linecap="round"/>
                        <path d="M112 40c4 12 4 18 0 26" fill="none" stroke="#7eb6ff" stroke-width="4" stroke-linecap="round"/>
                        <path d="M58 58c12-12 32-12 44 0" fill="none" stroke="#9ec6ff" stroke-width="5" stroke-linecap="round"/>
                      </g>
                      <g class="face face-rage">
                        <path d="M30 22l28 12M130 22l-28 12" fill="none" stroke="#ffb4a8" stroke-width="6" stroke-linecap="round"/>
                        <path d="M38 40h20M102 40h20" fill="none" stroke="#ffd0c8" stroke-width="7" stroke-linecap="round"/>
                        <path d="M56 58c14-12 34-12 48 0" fill="none" stroke="#ffb4a8" stroke-width="5" stroke-linecap="round"/>
                      </g>
                      <g class="face face-grimace">
                        <circle cx="48" cy="30" r="6" fill="#d7fff8"/>
                        <circle cx="112" cy="30" r="6" fill="#d7fff8"/>
                        <rect x="48" y="46" width="64" height="16" rx="4" fill="#e9fff8"/>
                        <path d="M64 46v16M80 46v16M96 46v16" fill="none" stroke="#12343a" stroke-width="2"/>
                      </g>
                    </svg>
                    <span class="visor-glare"></span>
                  </div>
                </div>
                <div class="robot-torso"><span class="chest-light"></span></div>
              </div>
              <span class="robot-shadow"></span>
            </div>
          </div>

          <p id="stage-mode" class="stage-mode" hidden>Noldan (A1–A2)</p>
          <p id="subtitle" class="subtitle is-empty"></p>

          <div class="stage-foot" hidden>
            <p id="status" class="status" data-state="idle" role="status">
              <span class="status-bars" aria-hidden="true"><i></i><i></i><i></i></span>
              <span id="status-text">Kutmoqda</span>
            </p>
          </div>
        </section>

        <section class="conversation" aria-label="Suhbat">
        <p id="speech-notice" class="speech-notice" hidden></p>

        <form id="composer" class="composer">
          <button id="mic-btn" class="mic-btn" type="button" aria-pressed="false" aria-label="Bosib turing va gapiring">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 15a3 3 0 0 0 3-3V7a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z" />
              <path d="M6.5 11a5.5 5.5 0 0 0 11 0M12 16.5V20M8.5 20h7" />
            </svg>
            <span id="mic-label" hidden>Mikrofon</span>
          </button>

          <label class="sr-only" for="user-input">Xabar</label>
          <input
            id="user-input"
            type="text"
            name="message"
            autocomplete="off"
            enterkeyhint="send"
            placeholder="Kecha nima qilganingni inglizcha aytib ber"
          />

          <button id="send-btn" class="send-btn" type="submit" hidden>Yuborish</button>
        </form>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
