<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AI Ingliz tili ustozi</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='14' y='6' width='36' height='52' rx='18' fill='%23fff' stroke='%238ec5ff' stroke-width='4'/%3E%3Ccircle cx='26' cy='28' r='4' fill='%232f6fe6'/%3E%3Ccircle cx='38' cy='28' r='4' fill='%232f6fe6'/%3E%3Cpath d='M24 40c3 4 13 4 16 0' fill='none' stroke='%231b2836' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="eyebrow">Shaxsiy ustoz</p>
            <h1>AI Ingliz tili ustozi</h1>
          </div>
        </div>
      </header>

      <main class="layout">
        <section class="stage" aria-label="Ustoz qiyofasi">
          <div class="stage-glow" aria-hidden="true"></div>

          <div id="avatar" class="avatar" data-state="idle" data-sticker="calm">
            <svg class="sticker sticker-calm" viewBox="0 0 200 200" aria-hidden="true">
              <rect x="18" y="18" width="164" height="164" rx="36" fill="#fff" stroke="#d5e4f5" stroke-width="4"/>
              <circle cx="78" cy="88" r="14" fill="#1d4fbe"/>
              <circle cx="122" cy="88" r="14" fill="#1d4fbe"/>
              <circle cx="82" cy="84" r="4" fill="#fff"/>
              <circle cx="126" cy="84" r="4" fill="#fff"/>
              <path d="M74 128c14 12 38 12 52 0" fill="none" stroke="#1b2838" stroke-width="6" stroke-linecap="round"/>
            </svg>
            <svg class="sticker sticker-laugh" viewBox="0 0 200 200" aria-hidden="true">
              <rect x="18" y="18" width="164" height="164" rx="36" fill="#fff7fb" stroke="#ffb3c9" stroke-width="4"/>
              <path d="M62 92c8 10 20 10 28 0" fill="none" stroke="#1b2838" stroke-width="6" stroke-linecap="round"/>
              <path d="M110 92c8 10 20 10 28 0" fill="none" stroke="#1b2838" stroke-width="6" stroke-linecap="round"/>
              <path d="M70 118c16 28 44 28 60 0" fill="#1b2838"/>
              <path d="M78 122h44v8H78z" fill="#fff"/>
              <circle cx="58" cy="112" r="8" fill="#ffb3c9"/>
              <circle cx="142" cy="112" r="8" fill="#ffb3c9"/>
            </svg>
            <svg class="sticker sticker-angry" viewBox="0 0 200 200" aria-hidden="true">
              <rect x="18" y="18" width="164" height="164" rx="36" fill="#fff4f2" stroke="#ff8d7a" stroke-width="4"/>
              <path d="M58 70l28 14" fill="none" stroke="#c2412d" stroke-width="7" stroke-linecap="round"/>
              <path d="M142 70l-28 14" fill="none" stroke="#c2412d" stroke-width="7" stroke-linecap="round"/>
              <circle cx="78" cy="96" r="10" fill="#1b2838"/>
              <circle cx="122" cy="96" r="10" fill="#1b2838"/>
              <path d="M74 138c14-16 38-16 52 0" fill="none" stroke="#c2412d" stroke-width="6" stroke-linecap="round"/>
            </svg>
            <svg class="sticker sticker-sad" viewBox="0 0 200 200" aria-hidden="true">
              <rect x="18" y="18" width="164" height="164" rx="36" fill="#f4f8ff" stroke="#b9cff0" stroke-width="4"/>
              <circle cx="78" cy="90" r="12" fill="#1d4fbe"/>
              <circle cx="122" cy="90" r="12" fill="#1d4fbe"/>
              <path d="M74 78c8 6 16 6 22 0" fill="none" stroke="#2457c5" stroke-width="5" stroke-linecap="round"/>
              <path d="M104 78c8 6 16 6 22 0" fill="none" stroke="#2457c5" stroke-width="5" stroke-linecap="round"/>
              <path d="M78 104c4 10 4 18 0 28" fill="none" stroke="#5aa7ff" stroke-width="5" stroke-linecap="round"/>
              <path d="M122 104c4 10 4 18 0 28" fill="none" stroke="#5aa7ff" stroke-width="5" stroke-linecap="round"/>
              <path d="M76 142c12-12 36-12 48 0" fill="none" stroke="#1b2838" stroke-width="6" stroke-linecap="round"/>
            </svg>
            <svg class="sticker sticker-explain" viewBox="0 0 200 200" aria-hidden="true">
              <rect x="18" y="18" width="164" height="164" rx="36" fill="#fff" stroke="#9dcbff" stroke-width="4"/>
              <path d="M60 74l26 8" fill="none" stroke="#2457c5" stroke-width="6" stroke-linecap="round"/>
              <path d="M114 78h28" fill="none" stroke="#2457c5" stroke-width="6" stroke-linecap="round"/>
              <circle cx="76" cy="98" r="12" fill="#1d4fbe"/>
              <circle cx="124" cy="98" r="12" fill="#1d4fbe"/>
              <circle cx="80" cy="94" r="4" fill="#fff"/>
              <circle cx="128" cy="94" r="4" fill="#fff"/>
              <ellipse cx="100" cy="138" rx="14" ry="10" fill="#1b2838"/>
            </svg>
          </div>

          <p id="stage-mode" class="stage-mode">Noldan (A1–A2)</p>
          <p id="subtitle" class="subtitle is-empty">Mikrofonni bosib turing. Qo‘yib yuborsangiz yuboriladi.</p>

          <div class="stage-foot">
            <p id="status" class="status" data-state="idle" role="status" aria-live="polite">
              <span class="status-bars" aria-hidden="true"><i></i><i></i><i></i></span>
              <span id="status-text">Kutmoqda</span>
            </p>
          </div>
        </section>

        <section class="conversation" aria-label="Suhbat">
        <p id="speech-notice" class="speech-notice" aria-live="polite"></p>

        <form id="composer" class="composer">
          <button id="mic-btn" class="mic-btn" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 15a3 3 0 0 0 3-3V7a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z" />
              <path d="M6.5 11a5.5 5.5 0 0 0 11 0M12 16.5V20M8.5 20h7" />
            </svg>
            <span id="mic-label">Mikrofon</span>
          </button>

          <label class="sr-only" for="user-input">Xabar</label>
          <input
            id="user-input"
            type="text"
            name="message"
            autocomplete="off"
            enterkeyhint="send"
            placeholder="Kecha nima qilganingni inglizcha aytib ber"
          />

          <button id="send-btn" class="send-btn" type="submit">Yuborish</button>
        </form>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
