<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AI Ingliz tili ustozi</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='14' y='6' width='36' height='52' rx='18' fill='%23fff' stroke='%238ec5ff' stroke-width='4'/%3E%3Ccircle cx='26' cy='28' r='4' fill='%232f6fe6'/%3E%3Ccircle cx='38' cy='28' r='4' fill='%232f6fe6'/%3E%3Cpath d='M24 40c3 4 13 4 16 0' fill='none' stroke='%231b2836' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="eyebrow">Shaxsiy ustoz</p>
            <h1>AI Ingliz tili ustozi</h1>
          </div>
        </div>
      </header>

      <main class="layout">
        <section class="stage" aria-label="Ustoz qiyofasi">
          <div class="stage-glow" aria-hidden="true"></div>

          <div id="avatar" class="avatar" data-state="idle" style="--mouth: 0">
            <span class="arm arm-left" aria-hidden="true"></span>
            <span class="arm arm-right" aria-hidden="true"></span>
            <div class="drop">
              <span class="shine" aria-hidden="true"></span>
              <span class="brow brow-left" aria-hidden="true"></span>
              <span class="brow brow-right" aria-hidden="true"></span>
              <span class="eye eye-left" aria-hidden="true"><i class="pupil"></i><i class="glint"></i></span>
              <span class="eye eye-right" aria-hidden="true"><i class="pupil"></i><i class="glint"></i></span>
              <span class="blush blush-left" aria-hidden="true"></span>
              <span class="blush blush-right" aria-hidden="true"></span>
              <span class="mouth" aria-hidden="true">
                <span class="teeth"></span>
              </span>
            </div>
          </div>

          <p id="stage-mode" class="stage-mode">Noldan (A1–A2)</p>
          <p id="subtitle" class="subtitle is-empty">Mikrofonni bosib turing. Qo‘yib yuborsangiz yuboriladi.</p>

          <div class="stage-foot">
            <p id="status" class="status" data-state="idle" role="status" aria-live="polite">
              <span class="status-bars" aria-hidden="true"><i></i><i></i><i></i></span>
              <span id="status-text">Kutmoqda</span>
            </p>
          </div>
        </section>

        <section class="conversation" aria-label="Suhbat">
        <p id="speech-notice" class="speech-notice" aria-live="polite"></p>

        <form id="composer" class="composer">
          <button id="mic-btn" class="mic-btn" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 15a3 3 0 0 0 3-3V7a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z" />
              <path d="M6.5 11a5.5 5.5 0 0 0 11 0M12 16.5V20M8.5 20h7" />
            </svg>
            <span id="mic-label">Mikrofon</span>
          </button>

          <label class="sr-only" for="user-input">Xabar</label>
          <input
            id="user-input"
            type="text"
            name="message"
            autocomplete="off"
            enterkeyhint="send"
            placeholder="Kecha nima qilganingni inglizcha aytib ber"
          />

          <button id="send-btn" class="send-btn" type="submit">Yuborish</button>
        </form>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
